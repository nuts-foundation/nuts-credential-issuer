---
name: 'Test'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l main.go internal/)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race)
        run: go test -race ./...

      # Integration test: drives the full OpenID4VCI flow against a real Nuts node
      # started with testcontainers. Needs Docker (present on ubuntu runners) and
      # binds host ports 8080/8081.
      - name: Integration test
        run: go test -tags integration -run TestIntegration ./internal/openid4vci/ -timeout 300s -v
