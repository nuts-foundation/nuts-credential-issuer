<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen met eHerkenning</title>
  <link rel="stylesheet" href="{{.StylePath}}">
</head>
<body>
  <header class="topbar">
    <div class="logo" aria-label="eHerkenning">
      <span class="mark"><span class="b1"></span><span class="b2"></span></span>
      <span class="word"><span class="e">e</span><span class="rest">Herkenning</span></span>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="head">
        <h1>Inloggen bij {{.Title}}</h1>
        <p>U logt in om een ServiceProviderCredential aan te vragen.</p>
      </div>
      <div class="body">
        <div class="demo">
          <span>⚠️</span>
          <span><b>Demo &mdash; geen echte eHerkenning.</b> Er vindt geen identiteitscontrole plaats. Pas de gegevens hieronder aan om als een andere organisatie in te loggen.</span>
        </div>
        <form method="post" action="{{.Action}}">
          <div class="field">
            <label for="legal_name">Organisatie (statutaire naam)</label>
            <input id="legal_name" name="legal_name" value="{{.LegalName}}" autocomplete="organization">
          </div>
          <div class="field">
            <label for="identifier">KvK-nummer</label>
            <input id="identifier" name="identifier" value="{{.Identifier}}" inputmode="numeric">
          </div>
          <button type="submit">Inloggen met eHerkenning <span class="arrow">&rarr;</span></button>
        </form>
      </div>
      <div class="foot">Betrouwbaarheidsniveau EH3 &middot; Demo-omgeving</div>
    </div>
  </main>
</body>
</html>
