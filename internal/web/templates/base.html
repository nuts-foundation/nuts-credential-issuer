{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{appTitle}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
  <style>
    :root {
      --brand: #1b9a8b;
      --brand-dark: #157568;
      --ink: #16202b;
      --muted: #61707d;
      --line: #e0e6ea;
      --bg: #eef2f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header.topbar {
      background: #fff; border-bottom: 1px solid var(--line);
      padding: .9rem 1.25rem; display: flex; align-items: center; gap: .6rem;
    }
    header.topbar .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
    header.topbar .name { font-weight: 700; letter-spacing: -.01em; }
    header.topbar .name span { color: var(--brand); }
    main { flex: 1; display: flex; justify-content: center; padding: 2.5rem 1rem; }
    .card {
      background: #fff; width: 100%; max-width: 32rem; border-radius: 10px;
      box-shadow: 0 10px 30px rgba(22,32,43,.08); overflow: hidden; align-self: flex-start;
    }
    .card .head { padding: 1.4rem 1.6rem 1rem; }
    .card .head .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
    .card .head h1 { margin: .3rem 0 0; font-size: 1.35rem; }
    .card .body { padding: 0 1.6rem 1.6rem; }
    p.lede { color: var(--muted); margin: 0 0 1.2rem; line-height: 1.5; }
    dl.summary { margin: 0 0 1.4rem; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    dl.summary > div { display: grid; grid-template-columns: 9rem 1fr; gap: 1rem; padding: .8rem 1rem; }
    dl.summary > div + div { border-top: 1px solid var(--line); }
    dl.summary dt { margin: 0; color: var(--muted); font-size: .85rem; }
    dl.summary dd { margin: 0; font-weight: 600; word-break: break-word; }
    dl.summary code { font: inherit; font-weight: 600; }
    dl.summary .detail { display: block; margin-top: .15rem; font-weight: 400; font-size: .78rem; color: var(--muted); word-break: break-all; }
    .field { margin: 0 0 1.3rem; }
    .field label { display: block; margin: 0 0 .35rem; font-size: .85rem; font-weight: 600; color: var(--muted); }
    .field input {
      width: 100%; padding: .6rem .7rem; font-size: 1rem; box-sizing: border-box;
      border: 1px solid var(--line); border-radius: 7px; background: #fcfcfe;
    }
    .field input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(27,154,139,.14); }
    .field .hint { display: block; margin-top: .3rem; font-size: .78rem; color: var(--muted); }
    .actions { display: flex; gap: .75rem; }
    button.primary {
      flex: 1; padding: .8rem 1rem; font-size: 1rem; font-weight: 600; color: #fff;
      background: var(--brand); border: 0; border-radius: 8px; cursor: pointer;
    }
    button.primary:hover { background: var(--brand-dark); }
    a.secondary {
      padding: .8rem 1.1rem; font-size: 1rem; font-weight: 600; color: var(--muted);
      border: 1px solid var(--line); border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center;
    }
    .err h1 { color: #b00020; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="dot"></span>
    <span class="name">{{appTitle}}</span>
  </header>
  <main>{{end}}

{{define "foot"}}</main>
</body>
</html>{{end}}
